name: Publish community node

on:
  push:
    tags:
      - 'community-node-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: community-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12.2.3

      - name: Check package version against tag
        if: startsWith(github.ref, 'refs/tags/community-node-v')
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          TAG_VERSION="${GITHUB_REF_NAME#community-node-v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Check package
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
